<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<title>Universidad Demo 21 - Portal Estudiantes</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Segoe+UI:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --brand-teal:#00a98f;
    --brand-teal-dark:#006755;
    --brand-teal-pale:#e6f6f4;
    --ink:#1b1b1b;
    --ink-muted:#5f6368;
    --border:#e2e2e2;
    --danger:#c0392b;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Segoe UI','Montserrat',sans-serif;
    background:#eaeaea;
  }

  .scene{
    position:relative;
    min-height:100vh;
    width:100%;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .scene::before{
    content:"";
    position:absolute;
    inset:0;
    background:
    linear-gradient(0deg, rgba(0,0,0,.35), rgba(0,0,0,.15)),
    url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSpkSVVR0SCLWmyodx-TTaEQ-9OkruWWtwRCWsXQMuV5ZfKaHEIb_BKDcAP&s=10') center/cover no-repeat;
    z-index:0;
  } 
  .scene::after{
    content:"";
    position:absolute;
    left:0; right:0; bottom:0;
    height:38%;
    background:linear-gradient(0deg, rgba(4,14,18,.65), transparent);
    z-index:1;
  }
  .campus-mark{
    position:absolute;
    right:8%;
    bottom:6%;
    width:120px;
    height:220px;
    z-index:1;
    opacity:.85;
    filter:drop-shadow(0 10px 24px rgba(0,0,0,.35));
  }

  .auth-wrap{
    position:relative;
    z-index:2;
    width:100%;
    max-width:480px;
  }
  .auth-card{
    background:#fff;
    border-radius:2px;
    box-shadow:0 20px 60px rgba(0,0,0,.35);
    overflow:hidden;
  }
  .auth-card-body{
    padding:44px 44px 36px;
  }
  .brand-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:28px;
  }
  .brand-mark{
    width:34px;height:34px;
    border-radius:8px;
    background:linear-gradient(135deg,var(--brand-teal),var(--brand-teal-dark));
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:800;font-size:15px;
    flex-shrink:0;
  }
  .brand-text{display:flex;flex-direction:column;line-height:1.15;}
  .brand-text .u{
    font-size:10.5px;letter-spacing:.08em;color:var(--ink-muted);
    font-weight:600;text-transform:uppercase;
  }
  .brand-text .name{font-size:19px;font-weight:800;color:var(--ink);letter-spacing:-.01em;}
  .brand-text .name span{color:var(--brand-teal);}

  h1.title{font-size:24px;font-weight:600;color:var(--ink);margin-bottom:22px;}

  .field{margin-bottom:6px;}
  .field label{display:block;font-size:13px;color:var(--ink-muted);margin-bottom:8px;}
  .field input{
    width:100%;font-size:15px;font-family:inherit;color:var(--ink);
    padding:8px 2px 10px;border:none;border-bottom:1px solid var(--border);
    outline:none;background:transparent;
  }
  .field input::placeholder{color:#9a9a9a;}
  .field input:focus{border-bottom:2px solid var(--brand-teal);padding-bottom:9px;}
  .field input.error{border-bottom:2px solid var(--danger);}

  .error-msg{
    display:none;
    font-size:12.5px;
    color:var(--danger);
    margin-top:8px;
  }
  .error-msg.show{display:block;}

  .helper-link{
    display:block;margin-top:14px;font-size:13.5px;line-height:1.5;
    color:#0067b8;text-decoration:none;
  }
  .helper-link:hover{text-decoration:underline;}

  .actions-row{
    display:flex;justify-content:flex-end;align-items:center;gap:10px;margin-top:38px;
  }
  .btn{
    font-family:inherit;font-size:14px;font-weight:600;padding:9px 26px;
    border-radius:2px;cursor:pointer;border:1px solid transparent;
  }
  .btn-ghost{background:#fff;color:var(--ink);border-color:#8a8a8a;}
  .btn-ghost:hover{background:#f5f5f5;}
  .btn-primary{background:#0067b8;color:#fff;}
  .btn-primary:hover{background:#004f8f;}

  .auth-card-footer{
    border-top:1px solid var(--border);padding:16px 44px;
    display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--ink);cursor:pointer;
  }
  .auth-card-footer:hover{background:#fafafa;}
  .key-icon{width:16px;height:16px;flex-shrink:0;color:var(--ink-muted);}

  .mock-badge{
    position:fixed;left:14px;bottom:12px;z-index:5;
    font-family:'Montserrat',sans-serif;font-size:11px;letter-spacing:.04em;
    color:rgba(255,255,255,.75);background:rgba(0,0,0,.35);
    padding:5px 10px;border-radius:20px;
  }

  @media (max-width:520px){
    .auth-card-body{padding:32px 24px 28px;}
    .auth-card-footer{padding:14px 24px;}
  }
</style>
</head>
<body>

<div class="scene">

  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-card-body">
        <div class="brand-row">
          <img src="https://aadcdn.msauthimages.net/dbd5a2dd-wac-bwrku047sxzpkorsczmogmasbqd-dxyhurl46xc/logintenantbranding/0/bannerlogo?ts=638793316944422418" alt="Logo Universidad Demo 21" style="height:44px;">
        </div>

        <h1 class="title">Iniciar sesión</h1>

        <form id="loginForm" onsubmit="return handleSubmit(event)">
          <div class="field">
            <label for="user">Ingresa tu usuario seguido de @demo21.edu.ar</label>
            <input id="user" type="text" placeholder="usuario@demo21.edu.ar" autocomplete="off">
          </div>
          <div class="error-msg" id="errorMsg">No encontramos esa cuenta. Probá con lucas.dilewski, alesio.giudice o fernanda.peon.</div>

          <a class="helper-link" href="#" onclick="return false;">
            Si no conoces o si olvidaste tu contraseña, podés restablecerla desde aquí
          </a>

          <div class="actions-row">
            <button class="btn btn-ghost" type="button">Atrás</button>
            <button class="btn btn-primary" type="submit">Siguiente</button>
          </div>
        </form>
      </div>

      <div class="auth-card-footer">
        <svg class="key-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="8" cy="15" r="4"/>
          <path d="M11 12 L20 3 M17 6 L20 9 M14 9 L16 11"/>
        </svg>
        Opciones de inicio de sesión
      </div>
    </div>
  </div>
</div>


<script>
  // Usuarios válidos del grupo (solo para esta demo visual, sin autenticación real)
  const USERS = {
    'lucas.dilewski': 1,
    'alesio.giudice': 2,
    'fernanda.peon': 3,
    'agustin.dilewski': 4
  };

  function handleSubmit(e){
    e.preventDefault();
    const input = document.getElementById('user');
    const errorMsg = document.getElementById('errorMsg');
    const raw = input.value.trim().toLowerCase();
    const clean = raw.replace('@demo21.edu.ar', '').trim();

    if (USERS[clean]) {
      input.classList.remove('error');
      errorMsg.classList.remove('show');
      window.location.href = `dashboard.html?user=${USERS[clean]}`;
    } else {
      input.classList.add('error');
      errorMsg.classList.add('show');
    }
    return false;
  }
</script>

</body>
</html>
